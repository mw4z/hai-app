<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#006d57" />
  <title>حي | Hai</title>
  <style>
    :root {
      --bg-light: radial-gradient(ellipse at 50% 42%, #e8f5e9 0%, #e0f7f2 40%, #fff 100%);
      --bg-dark:  radial-gradient(ellipse at 50% 42%, #101619 0%, #070b0d 40%, #000000 100%);
      --primary: #006d57;
      --text-light: #1a1a1a;
      --text-muted-light: #6b7280;
      --text-dark: #e9edef;
      --text-muted-dark: #8696a0;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "IBM Plex Sans Arabic", system-ui, sans-serif;
      background: var(--bg-light);
      color: var(--text-light);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: var(--bg-dark); color: var(--text-dark); }
    }
    .wrap {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      padding-top: calc(32px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      gap: 20px;
      text-align: center;
    }
    .icon {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: rgba(0, 109, 87, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }
    @media (prefers-color-scheme: dark) {
      .icon { background: rgba(0, 168, 132, 0.15); color: #00a884; }
    }
    h1 {
      font-size: 19px;
      font-weight: 700;
      margin: 0;
    }
    p {
      font-size: 14px;
      color: var(--text-muted-light);
      margin: 0;
      line-height: 1.6;
      max-width: 320px;
    }
    @media (prefers-color-scheme: dark) {
      p { color: var(--text-muted-dark); }
    }
    .row {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 280px;
    }
    button {
      font: inherit;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 22px;
      border-radius: 16px;
      border: 0;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      transition: transform 80ms ease, opacity 80ms ease;
      width: 100%;
    }
    button:active { transform: scale(0.97); opacity: 0.9; }
    button[disabled] { opacity: 0.5; cursor: default; transform: none; }
    .meta {
      font-size: 11px;
      opacity: 0.6;
      margin-top: 4px;
    }
    .en { direction: ltr; text-align: center; }
    .en h1 { font-size: 16px; opacity: 0.9; }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      display: inline-block;
      vertical-align: middle;
      margin-inline-end: 8px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon" aria-hidden="true">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تحقق من اتصالك وحاول مرة أخرى</p>
    </div>

    <div class="en">
      <h1>No internet connection</h1>
      <p>Check your connection and try again</p>
    </div>

    <div class="row">
      <button id="retry" type="button">
        <span id="retry-label">إعادة المحاولة · Try again</span>
      </button>
      <span class="meta" id="status">في انتظار الاتصال…</span>
    </div>
  </div>

  <script>
    (function () {
      var REMOTE_URL = 'https://app.hai-app.net'
      var btn = document.getElementById('retry')
      var label = document.getElementById('retry-label')
      var status = document.getElementById('status')
      var attempting = false

      function setStatus(text) { if (status) status.textContent = text }
      function setBusy(busy) {
        attempting = busy
        if (!btn) return
        btn.disabled = busy
        if (busy) {
          label.innerHTML = '<span class="spinner"></span>جاري المحاولة…'
        } else {
          label.textContent = 'إعادة المحاولة · Try again'
        }
      }

      // Probe the server with a tiny request before navigating. Avoids
      // a flicker-loop where the WebView keeps reloading the offline
      // page on every failure of the full SSR fetch.
      function probe() {
        return new Promise(function (resolve) {
          var ctrl = new AbortController()
          var to = setTimeout(function () { ctrl.abort() }, 4000)
          fetch(REMOTE_URL + '/api/ping?_=' + Date.now(), {
            method: 'GET',
            cache: 'no-store',
            credentials: 'omit',
            signal: ctrl.signal,
          }).then(function (r) {
            clearTimeout(to)
            resolve(!!(r && r.ok))
          }).catch(function () {
            clearTimeout(to)
            resolve(false)
          })
        })
      }

      function attemptRetry(silent) {
        if (attempting) return
        if (!silent) setBusy(true)
        setStatus('جاري الفحص…')
        probe().then(function (ok) {
          if (ok) {
            setStatus('تم الاتصال — جاري التحميل…')
            window.location.href = REMOTE_URL
          } else {
            setBusy(false)
            setStatus('لا يزال غير متصل')
          }
        })
      }

      if (btn) btn.addEventListener('click', function () { attemptRetry(false) })

      // Auto-retry on the browser's online event AND on a slow poll —
      // navigator.onLine can lie behind captive portals. silent=true
      // means we don't flip the button into the busy state, so the
      // user can still tap it freely.
      window.addEventListener('online', function () { attemptRetry(true) })
      setInterval(function () { attemptRetry(true) }, 5000)
      setTimeout(function () { attemptRetry(true) }, 200)
    })()
  </script>
</body>
</html>
