<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Adaptive-icon foreground: TRANSPARENT background + only the
       four-dot mark. Scaled to ~60% of the canvas so the dots stay
       inside Android's 66dp safe zone (out of the 108dp adaptive
       icon area), preventing them from being clipped by the
       launcher mask. The brand-teal background is supplied by
       @color/ic_launcher_background. -->
  <circle cx="256" cy="282" r="36" fill="#ffffff"/>
  <circle cx="256" cy="174" r="22" fill="#ffffff" fill-opacity="0.92"/>
  <circle cx="354" cy="338" r="22" fill="#ffffff" fill-opacity="0.92"/>
  <circle cx="158" cy="338" r="22" fill="#ffffff" fill-opacity="0.92"/>
</svg>
