<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <!-- Hai Play Store feature graphic — 1024x500. Typography-led
       composition matching the previous design language: near-black
       canvas, centered Arabic "حي" wordmark with a subtle brand-teal
       glow underneath, subtitle + tagline, then a row of category
       words separated by dots. Edge-to-edge, no transparency. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0a1518"/>
      <stop offset="55%"  stop-color="#0d2429"/>
      <stop offset="100%" stop-color="#06181c"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="36%" r="42%">
      <stop offset="0%"  stop-color="#00a884" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#00a884" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#00a884" stop-opacity="0"/>
    </radialGradient>
    <!-- Linear teal underline glow under the wordmark -->
    <linearGradient id="underline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00a884" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00a884" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00a884" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#centerGlow)"/>

  <!-- Faint dot grid for texture -->
  <g fill="#00a884" fill-opacity="0.05">
    <circle cx="80"  cy="80"  r="2"/>
    <circle cx="160" cy="120" r="2"/>
    <circle cx="60"  cy="200" r="2"/>
    <circle cx="200" cy="260" r="2"/>
    <circle cx="120" cy="380" r="2"/>
    <circle cx="40"  cy="440" r="2"/>
    <circle cx="900" cy="60"  r="2"/>
    <circle cx="970" cy="160" r="2"/>
    <circle cx="850" cy="220" r="2"/>
    <circle cx="980" cy="320" r="2"/>
    <circle cx="900" cy="430" r="2"/>
  </g>

  <!-- ── Main wordmark "حي" ─────────────────────────────────────── -->
  <text x="512" y="220"
        text-anchor="middle"
        font-family="'IBM Plex Sans Arabic', 'Noto Sans Arabic', 'Tahoma', 'Arial', sans-serif"
        font-size="180"
        font-weight="700"
        fill="#ffffff"
        letter-spacing="-2">
    حي
  </text>

  <!-- Brand-teal underline glow beneath the wordmark -->
  <rect x="380" y="240" width="264" height="4" fill="url(#underline)"/>

  <!-- ── Subtitle ───────────────────────────────────────────────── -->
  <text x="512" y="300"
        text-anchor="middle"
        font-family="'IBM Plex Sans Arabic', 'Noto Sans Arabic', 'Tahoma', 'Arial', sans-serif"
        font-size="38"
        font-weight="600"
        fill="#ffffff"
        fill-opacity="0.95">
    منصة حيّك الذكية
  </text>

  <!-- ── Tagline ────────────────────────────────────────────────── -->
  <text x="512" y="345"
        text-anchor="middle"
        font-family="'IBM Plex Sans Arabic', 'Noto Sans Arabic', 'Tahoma', 'Arial', sans-serif"
        font-size="24"
        font-weight="400"
        fill="#ffffff"
        fill-opacity="0.55">
    جارك أقرب مما تتوقع
  </text>

  <!-- ── Category strip ─────────────────────────────────────────── -->
  <text x="512" y="410"
        text-anchor="middle"
        font-family="'IBM Plex Sans Arabic', 'Noto Sans Arabic', 'Tahoma', 'Arial', sans-serif"
        font-size="22"
        font-weight="500"
        fill="#00a884"
        fill-opacity="0.95"
        letter-spacing="1">
    تنبيهات  ·  دردشة  ·  خدمات  ·  سوق
  </text>

  <!-- ── Page indicator dots ────────────────────────────────────── -->
  <g fill="#ffffff" fill-opacity="0.40">
    <circle cx="488" cy="450" r="3"/>
    <circle cx="500" cy="450" r="3"/>
    <circle cx="512" cy="450" r="3.5" fill-opacity="0.85"/>
    <circle cx="524" cy="450" r="3"/>
    <circle cx="536" cy="450" r="3"/>
  </g>
</svg>
