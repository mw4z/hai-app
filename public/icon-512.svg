<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Hai brand icon: a single Arabic letter ح (Hah) on the brand
       gradient. The letter is the first character of حي and reads as
       "neighborhood" to any Arabic speaker — a one-glyph mark, the
       way Slack uses # or X uses 𝕏. Generous padding so the letter
       breathes inside the rounded tile. -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00a884"/>
      <stop offset="100%" stop-color="#006d57"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#brand)"/>
  <rect width="512" height="512" rx="112" fill="url(#topGlow)"/>

  <!-- ح drawn as a thick stroke: a soft basin with a small tooth at
       the top-right. Tuned by eye so the shape stays crisp at every
       launcher size. The letter is intentionally small (≈48% of
       canvas) with generous breathing room — far less heavy than the
       previous house mark. -->
  <g fill="none" stroke="#ffffff" stroke-width="34"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- The basin: a wide arc opening upward, drawn as a smooth
         cubic curve from upper-right down through the bottom and
         back up to the upper-left. -->
    <path d="
      M 348 196
      C 396 220 412 296 372 348
      C 332 396 256 408 196 376
      C 132 340 116 268 156 224
    "/>
    <!-- Small tooth where the letter starts (top-right corner). -->
    <path d="M 348 196 L 348 232 L 322 232" />
  </g>
</svg>
