<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Hai brand icon: a home at the center with neighbors around it
       on a halo ring — literal expression of حي (neighborhood).
       Brand gradient matches hai-primary-500 → 600 in
       src/app/design-tokens.css. -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00a884"/>
      <stop offset="100%" stop-color="#006d57"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tile -->
  <rect width="512" height="512" rx="112" fill="url(#brand)"/>
  <rect width="512" height="512" rx="112" fill="url(#topGlow)"/>

  <!-- Neighborhood halo: a soft ring representing the area around
       the home. Drawn as a stroke so the brand gradient still
       shows through at the center. -->
  <circle cx="256" cy="272" r="178"
          fill="none"
          stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>

  <!-- Three neighbor dots placed on the halo ring, evenly spaced.
       Forms the visual triangle the brand has used since v1 while
       reading as "people around your home". -->
  <circle cx="256" cy="94"  r="22" fill="#ffffff" fill-opacity="0.92"/>
  <circle cx="411" cy="362" r="22" fill="#ffffff" fill-opacity="0.92"/>
  <circle cx="101" cy="362" r="22" fill="#ffffff" fill-opacity="0.92"/>

  <!-- The home at the center: simple peaked-roof silhouette. The
       door is cut back to the brand gradient so the home feels
       "open" / inviting rather than an opaque block. -->
  <g fill="#ffffff">
    <path d="M 158 286
             L 256 188
             L 354 286
             L 354 392
             Q 354 404 342 404
             L 170 404
             Q 158 404 158 392
             Z"/>
  </g>
  <!-- Door knocked out -->
  <path d="M 232 332
           L 232 404
           L 280 404
           L 280 332
           Q 280 308 256 308
           Q 232 308 232 332
           Z"
        fill="url(#brand)"/>
</svg>
