<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#006d57" />
  <title>حي | Hai</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: "IBM Plex Sans Arabic", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      background: radial-gradient(ellipse at 50% 42%, #e8f5e9 0%, #e0f7f2 40%, #fff 100%);
      color: #1a1a1a;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background: radial-gradient(ellipse at 50% 42%, #1c2832 0%, #1a262c 40%, #19232a 100%);
        color: #e9edef;
      }
    }

    /* This whole screen is meant to be visually INDISTINGUISHABLE
       from the AppSplash component (src/components/AppSplash.tsx) —
       so when the native shell shows this on a cold-start network
       failure, the user just sees "the app is still loading", not
       "the app is broken". Logo + ring + wave dots, same colors,
       same easing. Auto-reloads when the radio is back; renders
       nothing else (no text, no buttons, no error messaging). */

    .wrap {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .stage {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid #00a884;
      opacity: 0;
      animation: rp 1.8s ease-out infinite;
    }
    .r1 { width: 100px; height: 100px; animation-delay: 0.4s; }
    .r2 { width: 180px; height: 180px; animation-delay: 0.7s; }
    @keyframes rp {
      0%   { transform: scale(0.5); opacity: 0.35; }
      100% { transform: scale(1.2); opacity: 0; }
    }

    .logo {
      position: relative;
      z-index: 2;
      width: 68px;
      height: 68px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0, 168, 132, 0.32);
      animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
    }
    .logo svg { display: block; width: 100%; height: 100%; }
    @keyframes rise {
      from { opacity: 0; transform: scale(0.75); }
      to   { opacity: 1; transform: scale(1); }
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 14px;
      animation: fadeUp 0.5s ease-out 0.9s both;
    }
    .ar {
      font-size: 26px;
      font-weight: 700;
      color: #006d57;
      line-height: 1.6;
    }
    @media (prefers-color-scheme: dark) { .ar { color: #00a884; } }
    .en {
      font-size: 10px;
      font-weight: 600;
      color: #9ca3af;
      letter-spacing: 3px;
      margin-top: 4px;
    }
    @media (prefers-color-scheme: dark) { .en { color: #6b7280; } }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .loader {
      position: absolute;
      bottom: max(env(safe-area-inset-bottom, 20px), 44px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      animation: ldIn 0.3s ease-out 1.0s both;
    }
    .loader i {
      display: block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #00a884;
      animation: wave 1s ease-in-out infinite;
    }
    .loader i:nth-child(1) { animation-delay: 0s; }
    .loader i:nth-child(2) { animation-delay: 0.12s; }
    .loader i:nth-child(3) { animation-delay: 0.24s; }
    @keyframes wave {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
      40%            { transform: translateY(-6px); opacity: 1; }
    }
    @keyframes ldIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ring, .loader i { animation: none !important; }
      .ring { opacity: 0.08; transform: scale(1); }
      .loader i { opacity: 0.5; }
      .logo, .brand { animation-duration: 0.01s !important; animation-delay: 0s !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="stage">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="logo">
        <svg viewBox="0 0 192 192" width="68" height="68" xmlns="http://www.w3.org/2000/svg">
          <rect width="192" height="192" rx="42" fill="#006d57"/>
          <circle cx="96" cy="106" r="17" fill="#fff"/>
          <circle cx="96" cy="51"  r="11" fill="#fff"/>
          <circle cx="144" cy="134" r="11" fill="#fff"/>
          <circle cx="48"  cy="134" r="11" fill="#fff"/>
        </svg>
      </div>
    </div>
    <div class="brand">
      <span class="ar">حَيّ</span>
      <span class="en">HAI</span>
    </div>
    <div class="loader" aria-hidden="true">
      <i></i><i></i><i></i>
    </div>
  </div>

  <script>
    // Silent auto-reload. No buttons, no error text — the user just
    // sees a longer splash. Probe /api/ping every 400ms for the
    // first ~12s (covers radio warmup), then every 3s as a safety
    // net. Navigate the moment we get a 2xx. Also fires on the
    // browser `online` event for cases where the OS knows
    // connectivity is back before our probe does.
    (function () {
      var REMOTE_URL = 'https://app.hai-app.net'
      var navigating = false

      function probe() {
        return new Promise(function (resolve) {
          var ctrl = new AbortController()
          var to = setTimeout(function () { ctrl.abort() }, 2000)
          fetch(REMOTE_URL + '/api/ping?_=' + Date.now(), {
            method: 'GET',
            cache: 'no-store',
            credentials: 'omit',
            signal: ctrl.signal,
          }).then(function (r) {
            clearTimeout(to); resolve(!!(r && r.ok))
          }).catch(function () {
            clearTimeout(to); resolve(false)
          })
        })
      }

      function tryReload() {
        if (navigating) return
        probe().then(function (ok) {
          if (!ok || navigating) return
          navigating = true
          try { window.location.href = REMOTE_URL } catch (_) {}
        })
      }

      window.addEventListener('online', tryReload)

      var tries = 0
      function loop() {
        tryReload()
        tries++
        setTimeout(loop, tries < 30 ? 400 : 3000)
      }
      setTimeout(loop, 80)
    })()
  </script>
</body>
</html>
