<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#19232a" />
  <title>حي | Hai</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      font-family: "IBM Plex Sans Arabic", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      /* Mirror the native Capacitor splash composition: solid bg,
         monochrome ink. Light variant by default; dark variant via
         prefers-color-scheme. */
      background: #ffffff;
      color: #0a0a0a;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background: #19232a;
        color: #ffffff;
      }
    }

    /* Layout matches the native splash exactly (icon at 9 % of canvas
       with brand text below). offline.html is what shows when the
       WebView can't reach the server on cold-start — making it
       indistinguishable from the regular launch splash means a
       user on a flaky connection just sees "still loading", not
       "the app is broken / old design returned". */

    .wrap {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .logo {
      width: 84px;
      height: 84px;
      animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both;
    }
    .logo svg { display: block; width: 100%; height: 100%; }
    @keyframes rise {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 24px;
      animation: fadeUp 0.5s ease-out 0.3s both;
    }
    .ar {
      font-size: 22px;
      font-weight: 700;
      color: currentColor;
      line-height: 1;
    }
    .en {
      font-size: 10px;
      font-weight: 600;
      color: #6b7280;
      letter-spacing: 4px;
      margin-top: 6px;
      opacity: 0.55;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .loader {
      position: absolute;
      bottom: max(env(safe-area-inset-bottom, 20px), 28px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      animation: ldIn 0.3s ease-out 0.6s both;
    }
    .loader i {
      display: block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.55;
      animation: wave 1s ease-in-out infinite;
    }
    .loader i:nth-child(1) { animation-delay: 0s; }
    .loader i:nth-child(2) { animation-delay: 0.12s; }
    .loader i:nth-child(3) { animation-delay: 0.24s; }
    @keyframes wave {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
      40%            { transform: translateY(-6px); opacity: 1; }
    }
    @keyframes ldIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader i { animation: none !important; opacity: 0.5; }
      .logo, .brand { animation-duration: 0.01s !important; animation-delay: 0s !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <svg viewBox="0 0 192 192" width="84" height="84" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="6" width="180" height="180" rx="40"
              fill="none" stroke="currentColor" stroke-width="12"/>
        <circle cx="96" cy="96" r="73.5"
                fill="none" stroke="currentColor" stroke-opacity="0.18" stroke-width="1.2"/>
        <circle cx="96" cy="96" r="57"
                fill="none" stroke="currentColor" stroke-opacity="0.34" stroke-width="1.6"/>
        <circle cx="96" cy="96" r="19.5" fill="currentColor"/>
        <circle cx="96" cy="39" r="9.5" fill="currentColor"/>
        <circle cx="145.5" cy="124.5" r="9.5" fill="currentColor"/>
        <circle cx="46.5" cy="124.5" r="9.5" fill="currentColor"/>
      </svg>
    </div>
    <div class="brand">
      <span class="ar">حَيّ</span>
      <span class="en">HAI</span>
    </div>
    <div class="loader" aria-hidden="true">
      <i></i><i></i><i></i>
    </div>
  </div>

  <script>
    // Silent auto-reload — same probe loop as before. No buttons,
    // no error text. /api/ping every 400ms for the first ~12s
    // (covers radio warmup), then every 3s as a safety net.
    (function () {
      var REMOTE_URL = 'https://app.hai-app.net'
      var navigating = false

      function probe() {
        return new Promise(function (resolve) {
          var ctrl = new AbortController()
          var to = setTimeout(function () { ctrl.abort() }, 2000)
          fetch(REMOTE_URL + '/api/ping?_=' + Date.now(), {
            method: 'GET',
            cache: 'no-store',
            credentials: 'omit',
            signal: ctrl.signal,
          }).then(function (r) {
            clearTimeout(to); resolve(!!(r && r.ok))
          }).catch(function () {
            clearTimeout(to); resolve(false)
          })
        })
      }

      function tryReload() {
        if (navigating) return
        probe().then(function (ok) {
          if (!ok || navigating) return
          navigating = true
          try { window.location.href = REMOTE_URL } catch (_) {}
        })
      }

      window.addEventListener('online', tryReload)

      var tries = 0
      function loop() {
        tryReload()
        tries++
        setTimeout(loop, tries < 30 ? 400 : 3000)
      }
      setTimeout(loop, 80)
    })()
  </script>
</body>
</html>
