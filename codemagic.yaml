workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Hai
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "net.hai-app.hai"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web app
        script: |
          npx next build
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          # Fetch (or create) a DISTRIBUTION (App Store) profile + certificate
          # via the App Store Connect API integration. IOS_APP_STORE is a
          # distribution profile, so — unlike the development profile automatic
          # signing tried to mint — it needs NO registered devices. --create
          # builds it from the App ID's capabilities, so it includes Push.
          #
          # --certificate-key pins signing to OUR persistent private key (stored
          # as the CERT_KEY env var in Codemagic). Codemagic VMs are ephemeral,
          # so without a stored key every build either churns a new cert or hits
          # orphaned certs it has no key for ("Cannot save ... without private
          # key"). With the pinned key the same cert is reused every build.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERT_KEY" \
            --create
          # Add the fetched signing certificate(s) to the build keychain.
          keychain add-certificates
          # Point the Xcode project at the fetched distribution profile (manual
          # signing — which is exactly what `build-ipa` expects).
          xcode-project use-profiles
      - name: Build iOS app
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
