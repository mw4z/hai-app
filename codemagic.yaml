workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Hai
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "net.hai-app.hai"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web app
        script: |
          npx next build
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Set up App Store Connect API key
        script: |
          # Xcode-managed (automatic) signing. The old flow used
          # `fetch-signing-files --create` with a fresh cert every build,
          # which filled Apple's cert limit and produced BARE profiles
          # missing the app's capabilities (Push) — so the archive failed on
          # essentially every build. Automatic signing + the ASC API key lets
          # `-allowProvisioningUpdates` create/refresh a profile that always
          # includes the app's enabled capabilities, with no manual churn.
          keychain initialize
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8"
          # Export options for automatic App Store signing. build-ipa needs
          # this explicitly now that we don't run `use-profiles` (which used to
          # generate it). printf (not a heredoc) avoids YAML indentation traps.
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>signingStyle</key><string>automatic</string><key>teamID</key><string>XD95FL293Z</string><key>destination</key><string>export</string></dict></plist>\n' > "$HOME/export_options.plist"
      - name: Build iOS app
        script: |
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8 -authenticationKeyID $APP_STORE_CONNECT_KEY_IDENTIFIER -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist "$HOME/export_options.plist" \
            --archive-xcargs "$AUTH CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM=XD95FL293Z" \
            --export-xcargs "$AUTH"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
