workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Hai
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "net.hai-app.hai"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web app
        script: |
          npx next build
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Set up App Store Connect API key
        script: |
          # Xcode-managed (automatic) signing. The old flow used
          # `fetch-signing-files --create` with a fresh cert every build,
          # which filled Apple's cert limit and produced BARE profiles
          # missing the app's capabilities (Push) — so the archive failed on
          # essentially every build. Automatic signing + the ASC API key lets
          # `-allowProvisioningUpdates` create/refresh a profile that always
          # includes the app's enabled capabilities, with no manual churn.
          keychain initialize
          mkdir -p "$HOME/private_keys"
          KEY_FILE="$HOME/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8"
          printf '%b' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_FILE"
          # Non-secret diagnostics: prints ONLY the BEGIN/END header lines and
          # sizes (never the key body) so we can see the PEM's actual shape and
          # pinpoint why CryptoKit rejects it.
          echo "[p8] key_id=$APP_STORE_CONNECT_KEY_IDENTIFIER bytes=$(wc -c < "$KEY_FILE" | tr -d ' ') lines=$(wc -l < "$KEY_FILE" | tr -d ' ')"
          echo "[p8] first_line=$(head -n 1 "$KEY_FILE")"
          echo "[p8] last_line=$(tail -n 1 "$KEY_FILE")"
          # Fail HERE (not later in the build step) if the key isn't a valid
          # PEM, so the [p8] diagnostics are in the failing step you copy.
          head -n 1 "$KEY_FILE" | grep -q "BEGIN" || { echo "[p8] FATAL: key is not a valid PEM (empty or wrong format) — see [p8] lines above"; exit 1; }
      - name: Build iOS app
        script: |
          set -e
          # Raw xcodebuild — NOT `xcode-project build-ipa`, which force-appends
          # CODE_SIGN_STYLE=Manual (overriding Automatic) and can't do
          # Xcode-managed signing. Archive + export with automatic signing +
          # the ASC API key so a capability-complete profile is created.
          KEY="$HOME/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8"
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM=XD95FL293Z \
            archive
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
