workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Hai
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "net.hai-app.hai"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web app
        script: |
          npx next build
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Build iOS app
        script: |
          set -e
          # Raw xcodebuild — NOT `xcode-project build-ipa`, which force-appends
          # CODE_SIGN_STYLE=Manual (overriding Automatic) and can't do
          # Xcode-managed signing. Archive + export with automatic signing +
          # the ASC API key so a capability-complete profile is created.
          # Codemagic's app_store_connect integration already wrote the API key
          # to disk; $APP_STORE_CONNECT_PRIVATE_KEY holds an "@file:<path>"
          # pointer to it (NOT the key body). Strip the prefix to get the path.
          KEY="${APP_STORE_CONNECT_PRIVATE_KEY#@file:}"
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM=XD95FL293Z \
            archive
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
