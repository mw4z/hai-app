workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Hai
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "net.hai-app.hai"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web app
        script: |
          npx next build
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          export CERTIFICATE_PRIVATE_KEY=$(openssl genrsa 2048 2>/dev/null)
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: Android Release (AAB)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      node: 22
      java: 21
      vars:
        # Keystore signing — passwords come from Codemagic env vars
        # configured in the project settings (encrypted). The keystore
        # file itself is shipped as a base64-encoded env var
        # HAI_KEYSTORE_BASE64 and decoded into android/app/ at build
        # time so we never check the .keystore into git.
        HAI_KEY_ALIAS: hai
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web app
        script: |
          npx next build
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Decode signing keystore
        script: |
          if [ -z "$HAI_KEYSTORE_BASE64" ]; then
            echo "ERROR: HAI_KEYSTORE_BASE64 is not set in Codemagic env"
            exit 1
          fi
          if [ -z "$HAI_KEYSTORE_PASSWORD" ] || [ -z "$HAI_KEY_PASSWORD" ]; then
            echo "ERROR: HAI_KEYSTORE_PASSWORD / HAI_KEY_PASSWORD not set"
            exit 1
          fi
          echo "$HAI_KEYSTORE_BASE64" | base64 --decode > android/app/hai-release.keystore
          ls -la android/app/hai-release.keystore
      - name: Build Android app bundle
        script: |
          cd android
          ./gradlew bundleRelease --no-daemon
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt
